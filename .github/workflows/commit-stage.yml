# Nome descrittivo della pipeline che appare nell'interfaccia di GitHub Actions
name: Commit Stage

# Trigger: questa pipeline si attiva ogni volta che fai un push su qualsiasi branch
on: push

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    # Permessi necessari per analizzare la sicurezza e caricare i risultati nel tab 'Security' di GitHub
    permissions:
      contents: read
      security-events: write

    steps:
      # Step 1: Scarica il codice sorgente nel runner per poter lavorare sui file
      - name: Checkout source code
        uses: actions/checkout@v3

      # Step 2: Configura l'ambiente Java (JDK 17).
      # Usiamo 'cache: gradle' per rendere i build successivi molto più veloci scaricando meno dipendenze.
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Step 3: Scansione di sicurezza statica.
      # 'continue-on-error: true' evita che la build fallisca bloccando tutto se trova una vulnerabilità lieve.
      - name: Code Vulnerability scanning
        uses: anchore/scan-action@v3
        id: scan
        continue-on-error: true
        with:
          path: "${{ github.workspace }}"
          fail-build: false
          severity-cutoff: high
          scs-report-enable: true

      # Step 4: Carica il report in formato SARIF.
      # Grazie a 'if: always()', questo step viene eseguito anche se la scansione fallisce.
      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      # Step 5: Esecuzione del build Gradle.
      # 'chmod +x' è essenziale su Linux per garantire che il file gradlew abbia i permessi di esecuzione.
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build